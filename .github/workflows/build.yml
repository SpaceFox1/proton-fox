name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Determine Build Name
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # If triggered by a tag, use the tag name and strip a leading 'v' if present
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # If triggered by a commit/PR, use the 7-character short Git SHA
            VERSION="${GITHUB_SHA::7}"
          fi
          # Save it to the GitHub environment so subsequent steps can use it
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Configured build version: $VERSION"

      - name: Apply patches
        run: ./patches/protonprep-valve-staging.sh

      - name: Configure and Build
        run: |
          mkdir build && cd build
          ../configure.sh --build-name=Proton-fox-${{ env.BUILD_VERSION }}
          make redist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: proton-fox-${{ env.BUILD_VERSION }}
          path: |
            build/Proton-fox-${{ env.BUILD_VERSION }}.tar.gz
            build/Proton-fox-${{ env.BUILD_VERSION }}.sha512sum
